[project]
name = "coursework"
version = "0.1.0"
description = ""
authors = [
    {name = "Bykov_Max",email = "maksim.bykov.1997@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.0,<3.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "xlrd (>=2.0.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
coverage = "^7.9.1"
xlwt = "^1.3.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
isort = "^6.0.1"
black = "^25.1.0"
mypy = "^1.16.1"

[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
)/
'''

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv|tests'
